dataset:
  audio_dir: data/raw/audio
  text_dir: data/raw/transcripts

audio:
  sample_rate: 16000
  normalize: true
  trim_silence: true

text:
  lowercase: true
  normalize_numbers: true
  normalize_dates: true
  expand_abbrev: true

nemo:
  use_pretrained: true

  models:
    en: "models/en/QuartzNet15x5Base-En.nemo"
    vi: "models/vi/parakeet-ctc-0.6b-vi.nemo"

  default_language: vi
  device: cpu

output:
  manifest_path: data/processed/manifest.jsonl

eval:
  wer: true